<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact KM Kits Africa for volunteer opportunities and partnerships.">
  <title>Contact — KM Kits Africa</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/main.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="site-title">KM Kits Africa</h1>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="km-kits.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="donate.html">Donate</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="contact-title">
      <header class="card-header" id="contact-title">Contact Us</header>
      <div class="card-body">
        <p>Reach out to KM Kits Africa for volunteering, donations, or partnership inquiries.</p>
        <form action="mailto:info@kmkitsafrica.org" method="post" enctype="text/plain" class="contact-form">
          <fieldset>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </fieldset>
          <fieldset>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </fieldset>
          <fieldset>
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
          </fieldset>
          <fieldset>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </fieldset>
          <button type="submit" class="submit-button">Send Message</button>
        </form>
      </div>
    </section>

    <section class="content-section">
      <h2>Contact Details</h2>
      <p>Email: <a href="mailto:info@kmkitsafrica.org">info@kmkitsafrica.org</a></p>
      <p>Phone: +256 780 123 456</p>
      <p>Office: Kampala, Uganda</p>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="currentYear">2025</span> KM Kits Africa — <a href="terms.html">Terms</a> | <a href="privacy.html">Privacy</a></p>
  </footer>
</body>
</html>
